name: Update paper list

on:
  schedule:
    - cron: '23 1 * * 1' # Monday 09:23 Asia/Shanghai
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill start YYYY-MM-DD (optional)'
        type: string
      until:
        description: 'Backfill end YYYY-MM-DD (optional)'
        type: string
      review_only:
        description: Review saved candidates without collecting sources
        type: boolean
        default: false
      no_llm:
        description: 'Collect without LLM'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['radar/**', 'tests/**', 'data/**', 'config.json', 'README.md', '.github/workflows/radar.yml']

permissions:
  contents: read

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect papers
        id: collect
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
          INPUT_REVIEW_ONLY: ${{ inputs.review_only }}
          INPUT_NO_LLM: ${{ inputs.no_llm }}
        shell: bash
        run: |
          args=()
          if [ -n "$INPUT_SINCE" ]; then args+=(--since "$INPUT_SINCE"); fi
          if [ -n "$INPUT_UNTIL" ]; then args+=(--until "$INPUT_UNTIL"); fi
          if [ "$INPUT_NO_LLM" = "true" ]; then args+=(--no-llm); fi
          if [ "$INPUT_REVIEW_ONLY" = "true" ]; then args+=(--review-only); fi
          python -m radar collect "${args[@]}"
      - name: Update README
        run: python -m radar build
      - name: Save collection and README
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper list'
            git push origin HEAD:main
          fi
      - name: Report collection health
        if: always() && github.event_name != 'push' && steps.collect.outcome == 'success'
        run: python -m radar report >> "$GITHUB_STEP_SUMMARY"
